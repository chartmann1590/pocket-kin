name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        run: |
          npm --prefix backend ci
          npm --prefix backend test
          npm --prefix backend run check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build phone & wear debug APKs and run phone unit tests
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :phone:assembleDebug :wear:assembleDebug :phone:testDebugUnitTest --no-daemon
