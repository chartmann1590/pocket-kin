name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      changesNotSentForReview:
        description: 'Do not automatically submit for review (recommended for drafts & first release)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # AdMob Production IDs (injected securely from GitHub Secrets)
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      BANNER_AD_UNIT: ${{ secrets.BANNER_AD_UNIT }}
      INTERSTITIAL_AD_UNIT: ${{ secrets.INTERSTITIAL_AD_UNIT }}
      REWARDED_INTERSTITIAL_AD_UNIT: ${{ secrets.REWARDED_INTERSTITIAL_AD_UNIT }}
      REWARDED_AD_UNIT: ${{ secrets.REWARDED_AD_UNIT }}

      # Keystore Signing Credentials
      KIN_STORE_PASSWORD: ${{ secrets.KIN_STORE_PASSWORD }}
      KIN_KEY_ALIAS: ${{ secrets.KIN_KEY_ALIAS || 'pocketkin' }}
      KIN_KEY_PASSWORD: ${{ secrets.KIN_KEY_PASSWORD }}

      # Secret presence indicators for conditional execution
      HAS_PLAY_KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 != '' }}
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Decode Upload Keystore
        if: env.HAS_PLAY_KEYSTORE == 'true'
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > android/pocket-kin-upload.keystore

      - name: Decode Firebase Google Services JSON
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/phone/google-services.json

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew || true

      - name: Build Release App Bundles (Phone & Wear OS)
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew :phone:bundleRelease :wear:bundleRelease --no-daemon
          else
            gradle :phone:bundleRelease :wear:bundleRelease --no-daemon
          fi

      - name: Upload Phone App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-kin-phone-release
          path: android/phone/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Wear OS App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-kin-wear-release
          path: android/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish to Google Play Store (Phone & Wear)
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pocketkin.game
          releaseFiles: 'android/phone/build/outputs/bundle/release/*.aab,android/wear/build/outputs/bundle/release/*.aab'
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          changesNotSentForReview: ${{ github.event_name == 'workflow_dispatch' && inputs.changesNotSentForReview || true }}
